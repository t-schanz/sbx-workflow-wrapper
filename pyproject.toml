[project]
name = "hx"
version = "0.1.0"
description = "Sandbox workflow CLI: one Docker sandbox (sbx --clone) per feature branch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
]

[project.scripts]
hx = "hx.cli:main"
hxmr = "hx.cli:hxmr_main"
hxrm = "hx.cli:hxrm_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hx"]
